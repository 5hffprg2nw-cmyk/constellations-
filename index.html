<head>
  <meta charset="UTF-8" />

  <title>Following Post-Structuralism</title>
  <style>
    :root {
      --bg: #0c0f14;
      --panel: #141922;
      --panel-2: #1b2230;
      --text: #e8ecf3;
      --muted: #9aa5b8;
      --accent: #7aa2f7;
      --border: #283142;
    }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      background: var(--panel);
    }
    h1 { font-size: 1.1rem; margin: 0; }
    .controls { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    select, input, button {
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 7px 10px;
      font-size: 0.9rem;
    }
    button {
      cursor: pointer;
      border-color: var(--accent);
    }
    button:hover { background: #242e40; }
    .layout {
      display: grid;
      grid-template-columns: 1fr 380px;
      min-height: calc(100vh - 64px);
    }
    @media (max-width: 900px) {
      .layout { grid-template-columns: 1fr; }
    }
    #stage { position: relative; overflow: hidden; min-height: 520px; }
    svg { width: 100%; height: 100%; display: block; }
    .tooltip {
      position: fixed;
      pointer-events: none;
      max-width: 320px;
      background: rgba(20, 25, 34, 0.96);
      border: 1px solid var(--accent);
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 0.85rem;
      line-height: 1.4;
      box-shadow: 0 8px 24px rgba(0,0,0,0.45);
      opacity: 0;
      transition: opacity 0.12s ease;
      z-index: 20;
    }
    aside {
      border-left: 1px solid var(--border);
      background: var(--panel);
      padding: 18px;
      overflow-y: auto;
    }
    .badge {
      display: inline-block;
      font-size: 0.75rem;
      padding: 3px 8px;
      border-radius: 999px;
      background: var(--panel-2);
      color: var(--accent);
      margin-bottom: 8px;
    }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 16px; }
    .chip {
      font-size: 0.78rem;
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 4px 8px;
    }
    ul.links { list-style: none; padding: 0; margin: 8px 0 0; }
    ul.links li { margin-bottom: 6px; }
    ul.links a { color: var(--accent); text-decoration: none; }
    ul.links a:hover { text-decoration: underline; }
  </style>
</head>

    const COLORS = {
      "Ontological & Realist Breaks": "#7aa2f7",
      "Materiality, Embodiment & Technics": "#73daca",
      "Subjectivity, Negativity & Politics": "#bb9af7",
      "Situated, Decolonial & Diasporic Critiques": "#ff9e64"
    };

    const svg = document.getElementById("map");
    const tooltip = document.getElementById("tooltip");
    const inspector = document.getElementById("inspector");
    const clusterFilter = document.getElementById("clusterFilter");
    const searchInput = document.getElementById("searchInput");
    const copyOffsetsBtn = document.getElementById("copyOffsetsBtn");
    const statusText = document.getElementById("statusText");

    let selectedId = null;
    const width = 900;
    const height = 650;
    svg.setAttribute("viewBox", `0 0 ${width} ${height}`);

    const yOffset = -28;
    const clusterCenters = {
      "Ontological & Realist Breaks": { x: 225, y: 190 + yOffset },
      "Materiality, Embodiment & Technics": { x: 665, y: 220 + yOffset },
      "Subjectivity, Negativity & Politics": { x: 260, y: 414 + yOffset },
      "Situated, Decolonial & Diasporic Critiques": { x: 640, y: 414 + yOffset }
    };

    const nodeOffsets = {
      "speculative-realism": { dx: 0, dy: 0 },
      "neo-rationalism": { dx: 0, dy: 0 },
      "non-philosophy": { dx: 0, dy: 0 },
      "new-realism-grounding": { dx: 0, dy: 0 },

      "feminist-new-materialism": { dx: 0, dy: 0 },
      "plasticity-neuro-philosophy": { dx: 0, dy: 0 },
      "philosophy-of-technics": { dx: 0, dy: 0 },
      "actor-network-theory": { dx: 0, dy: 0 },
      "enactivism-4e": { dx: 0, dy: 0 },

      "lacanian-non-all": { dx: 0, dy: 0 },
      "post-foundational-political": { dx: 0, dy: 0 },
      "queer-negativity-trans": { dx: 0, dy: 0 },
      "accelerationism-xenofeminism": { dx: 0, dy: 0 },
      "post-liberal-critical-political": { dx: 0, dy: 0 },

      "ontological-turn": { dx: 0, dy: 0 },
      "indigenous-critical": { dx: 0, dy: 0 },
      "decolonial-theory": { dx: 0, dy: 0 },
      "afro-pessimism-para-ontology": { dx: 0, dy: 0 }
    };

    const pinnedIds = new Set(
      Object.entries(nodeOffsets)
        .filter(([, off]) => (off.dx || 0) !== 0 || (off.dy || 0) !== 0)
        .map(([id]) => id)
    );

    const nodes = CONSTELLATIONS.map((c, i) => {
      const base = clusterCenters[c.cluster];
      const angle = (i * 1.35);
      return {
        ...c,
        x: base.x + Math.cos(angle) * 95,
        y: base.y + Math.sin(angle) * 85,
        vx: 0,
        vy: 0
      };
    });

    const nodeById = Object.fromEntries(nodes.map(n => [n.id, n]));
    const links = LINKS.map(l => ({
      ...l,
      sourceNode: nodeById[l.source],
      targetNode: nodeById[l.target]
    }));

    const initialSimPos = {};
    let draggedNode = null;
    let draggedEl = null;
    let wasDragged = false;

    function setStatus(msg) {
      statusText.textContent = msg;
    }

    function isLocked(nodeId) {
      return pinnedIds.has(nodeId) || draggedNode?.id === nodeId;
    }

    function recordInitialSimPos() {
      for (const n of nodes) {
        initialSimPos[n.id] = { x: n.x, y: n.y };
      }
    }

    function applyNodeOffsets() {
      for (const n of nodes) {
        const base = initialSimPos[n.id] || { x: n.x, y: n.y };
        const off = nodeOffsets[n.id] || { dx: 0, dy: 0 };
        n.x = Math.max(145, Math.min(width - 145, base.x + (off.dx || 0)));
        n.y = Math.max(25, Math.min(height - 20, base.y + (off.dy || 0)));
      }
    }

    function showTooltip(html, x, y) {
      tooltip.innerHTML = html;
      tooltip.style.left = Math.min(window.innerWidth - 340, x + 14) + "px";
      tooltip.style.top = Math.min(window.innerHeight - 140, y + 14) + "px";
      tooltip.style.opacity = "1";
    }

    function hideTooltip() {
      tooltip.style.opacity = "0";
    }

    function renderInspector(node) {
      selectedId = node.id;
      const color = COLORS[node.cluster];
      inspector.innerHTML = `
        <span class="badge" style="color:${color}">${node.cluster}</span>
        <h2 style="margin:4px 0 10px;font-size:1.15rem;">${node.title}</h2>
        <p style="font-size:0.9rem;line-height:1.5;color:#cbd5e1;">${node.engagement}</p>
        <h3 style="font-size:0.8rem;text-transform:uppercase;letter-spacing:0.05em;color:var(--muted);margin-top:16px;">Thematic Touchstones</h3>
        <div class="chips">${node.touchstones.map(t => `<span class="chip">${t}</span>`).join("")}</div>
        <h3 style="font-size:0.8rem;text-transform:uppercase;letter-spacing:0.05em;color:var(--muted);">Key References & Links</h3>
        <ul class="links">
          ${node.figures.map(f => `<li><a href="${f.url}" target="_blank" rel="noopener noreferrer">${f.name} ↗</a></li>`).join("")}
        </ul>
      `;
      draw();
    }

    function matchesFilter(node) {
      const cVal = clusterFilter.value;
      const q = searchInput.value.trim().toLowerCase();
      if (cVal !== "all" && node.cluster !== cVal) return false;
      if (!q) return true;
      return (
        node.title.toLowerCase().includes(q) ||
        node.snippet.toLowerCase().includes(q) ||
        node.touchstones.some(t => t.toLowerCase().includes(q)) ||
        node.figures.some(f => f.name.toLowerCase().includes(q))
      );
    }

    function stepSimulation() {
      for (let iter = 0; iter < 60; iter++) {
        for (let i = 0; i < nodes.length; i++) {
          for (let j = i + 1; j < nodes.length; j++) {
            const aLocked = isLocked(nodes[i].id);
            const bLocked = isLocked(nodes[j].id);
            if (aLocked && bLocked) continue;

            const dx = nodes[j].x - nodes[i].x;
            const dy = nodes[j].y - nodes[i].y;
            const scaledDx = dx * 0.65;
            const scaledDy = dy * 1.15;
            const dist = Math.hypot(scaledDx, scaledDy) || 1;
            if (dist < 135) {
              const push = (135 - dist) * 0.045;
              const ux = scaledDx / dist;
              const uy = scaledDy / dist;
              if (!aLocked) {
                nodes[i].x = Math.max(145, Math.min(width - 145, nodes[i].x - ux * push * 1.4));
                nodes[i].y = Math.max(25, Math.min(height - 20, nodes[i].y - uy * push * 0.8));
              }
              if (!bLocked) {
                nodes[j].x = Math.max(145, Math.min(width - 145, nodes[j].x + ux * push * 1.4));
                nodes[j].y = Math.max(25, Math.min(height - 20, nodes[j].y + uy * push * 0.8));
              }
            }
          }
        }

        for (const n of nodes) {
          if (isLocked(n.id)) continue;
          const target = clusterCenters[n.cluster];
          n.x += (target.x - n.x) * 0.012;
          n.y += (target.y - n.y) * 0.012;
          n.x = Math.max(145, Math.min(width - 145, n.x));
          n.y = Math.max(25, Math.min(height - 20, n.y));
        }

        const ant = nodeById["actor-network-theory"];
        const nonPhil = nodeById["non-philosophy"];
        if (ant && nonPhil) {
          const gapX = ant.x - nonPhil.x;
          const gapY = Math.abs(ant.y - nonPhil.y);
          if (gapY < 55 && gapX < 290) {
            const shift = (290 - gapX) * 0.04;
            if (!isLocked(nonPhil.id)) {
              nonPhil.x = Math.max(145, nonPhil.x - shift);
            }
            if (!isLocked(ant.id)) {
              ant.x = Math.min(width - 145, ant.x + shift);
            }
          }
        }

        const fnm = nodeById["feminist-new-materialism"];
        const pot = nodeById["philosophy-of-technics"];
        if (fnm && pot) {
          const dx2 = pot.x - fnm.x;
          const dy2 = pot.y - fnm.y;
          const dist2 = Math.hypot(dx2, dy2) || 1;
          if (dist2 < 185) {
            const push2 = (185 - dist2) * 0.05;
            const ux2 = dx2 / dist2;
            const uy2 = dy2 / dist2;
            if (!isLocked(fnm.id)) {
              fnm.x = Math.max(145, Math.min(width - 145, fnm.x - ux2 * push2));
              fnm.y = Math.max(25, Math.min(height - 55, fnm.y - uy2 * push2 + 0.6));
            }
            if (!isLocked(pot.id)) {
              pot.x = Math.max(145, Math.min(width - 145, pot.x + ux2 * push2));
              pot.y = Math.max(25, Math.min(height - 55, pot.y + uy2 * push2 - 1.4));
            }
          }
        }
      }
    }

    function draw() {
      svg.innerHTML = "";
      const activeIds = new Set(nodes.filter(matchesFilter).map(n => n.id));

      for (const l of links) {
        const visible = activeIds.has(l.source) && activeIds.has(l.target);
        const connectedToSelected = selectedId && (l.source === selectedId || l.target === selectedId);
        const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
        line.setAttribute("x1", l.sourceNode.x);
        line.setAttribute("y1", l.sourceNode.y);
        line.setAttribute("x2", l.targetNode.x);
        line.setAttribute("y2", l.targetNode.y);
        line.setAttribute("stroke", connectedToSelected ? "#7aa2f7" : "#2f3b52");
        line.setAttribute("stroke-width", connectedToSelected ? "2.4" : "1.2");
        line.setAttribute("opacity", visible ? (connectedToSelected ? "0.95" : "0.45") : "0.08");
        line.style.cursor = "pointer";
        line.addEventListener("mousemove", e => {
          showTooltip(`<strong>Connection</strong><br>${l.note}`, e.clientX, e.clientY);
        });
        line.addEventListener("mouseleave", hideTooltip);
        svg.appendChild(line);
      }

      for (const n of nodes) {
        const visible = activeIds.has(n.id);
        const isSelected = n.id === selectedId;
        const color = COLORS[n.cluster];

        const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
        g.dataset.id = n.id;
        g.setAttribute("transform", `translate(${n.x}, ${n.y})`);
        g.style.cursor = "pointer";
        g.style.opacity = visible ? "1" : "0.18";

        const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
        circle.setAttribute("r", isSelected ? "10" : "7.5");
        circle.setAttribute("fill", color);
        circle.setAttribute("stroke", isSelected ? "#ffffff" : "#0c0f14");
        circle.setAttribute("stroke-width", isSelected ? "2.5" : "1.5");

        const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
        text.setAttribute("dy", "-13");
        text.setAttribute("text-anchor", "middle");
        text.setAttribute("fill", "#e8ecf3");
        text.setAttribute("font-size", "11.5");
        text.setAttribute("font-weight", isSelected ? "600" : "400");
        text.textContent = n.title;

        g.addEventListener("mousedown", e => {
          e.stopPropagation();
          draggedNode = n;
          draggedEl = g;
          wasDragged = false;
          hideTooltip();
          setStatus(`Dragging ${n.title}...`);
        });
        g.addEventListener("mousemove", e => {
          if (draggedNode) return;
          showTooltip(`<strong>${n.title}</strong><br><span style="color:#9aa5b8;">${n.cluster}</span><br><br>${n.snippet}`, e.clientX, e.clientY);
        });
        g.addEventListener("mouseleave", hideTooltip);
        g.addEventListener("click", () => {
          if (!wasDragged) renderInspector(n);
          wasDragged = false;
        });

        g.appendChild(circle);
        g.appendChild(text);
        svg.appendChild(g);
      }
    }

    function toSvgPoint(clientX, clientY) {
      const pt = svg.createSVGPoint();
      pt.x = clientX;
      pt.y = clientY;
      const ctm = svg.getScreenCTM();
      return ctm ? pt.matrixTransform(ctm.inverse()) : { x: 0, y: 0 };
    }

    window.addEventListener("mousemove", e => {
      if (!draggedNode) return;
      wasDragged = true;
      const p = toSvgPoint(e.clientX, e.clientY);
      draggedNode.x = Math.max(145, Math.min(width - 145, Math.round(p.x)));
      draggedNode.y = Math.max(25, Math.min(height - 20, Math.round(p.y)));
      if (draggedEl) {
        draggedEl.setAttribute("transform", `translate(${draggedNode.x}, ${draggedNode.y})`);
      }
    });

    window.addEventListener("mouseup", () => {
      if (!draggedNode) return;
      const base = initialSimPos[draggedNode.id] || { x: draggedNode.x, y: draggedNode.y };
      const dx = Math.round(draggedNode.x - base.x);
      const dy = Math.round(draggedNode.y - base.y);
      nodeOffsets[draggedNode.id] = { dx, dy };
      pinnedIds.add(draggedNode.id);
      setStatus(`Locked ${draggedNode.id}: dx ${dx}, dy ${dy}`);
      draggedNode = null;
      draggedEl = null;
      draw();
    });

    copyOffsetsBtn.addEventListener("click", async () => {
      const snippet = `const nodeOffsets = ${JSON.stringify(nodeOffsets, null, 2)};`;
      try {
        await navigator.clipboard.writeText(snippet);
      } catch {
        const area = document.createElement("textarea");
        area.value = snippet;
        document.body.appendChild(area);
        area.select();
        document.execCommand("copy");
        area.remove();
      }
      const prev = copyOffsetsBtn.textContent;
      copyOffsetsBtn.textContent = "Copied!";
      setStatus("Copied nodeOffsets to clipboard");
      setTimeout(() => { copyOffsetsBtn.textContent = prev; }, 1200);
    });

    clusterFilter.addEventListener("change", draw);
    searchInput.addEventListener("input", draw);

    stepSimulation();
    recordInitialSimPos();
    applyNodeOffsets();
    draw();
  </script>
</body>
</html>
